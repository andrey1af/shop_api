include:
  - path: backend/api-service/compose.yaml
    project_directory: .
  - path: backend/auth-service/compose.yaml
    project_directory: .
  - path: backend/image-service/compose.yaml
    project_directory: .
  - path: backend/generator-service/compose.yaml
    project_directory: .

services:
  # Кэш картинок api-service. Без сохранения на диск; при заполнении
  # maxmemory вытесняются давно не использованные ключи.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Брокер в режиме KRaft (без ZooKeeper), один узел — и broker, и controller.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаются явно в kafka-init, опечатка в имени не должна плодить новые.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic "${KAFKA_PRODUCT_UPDATES_TOPIC:-product.updates}"
        --partitions "${KAFKA_PRODUCT_UPDATES_PARTITIONS:-3}"
        --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        openapi: ./api/openapi
    environment:
      API_UPSTREAM: "api:${HTTP_PORT:-8090}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
