include:
  - path: backend/api-service/compose.prod.yaml
    project_directory: .
    env_file: .env.prod
  - path: backend/auth-service/compose.prod.yaml
    project_directory: .
    env_file: .env.prod
  - path: backend/image-service/compose.prod.yaml
    project_directory: .
    env_file: .env.prod

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        openapi: ./api/openapi
    environment:
      API_UPSTREAM: "api:${HTTP_PORT:-8090}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always
